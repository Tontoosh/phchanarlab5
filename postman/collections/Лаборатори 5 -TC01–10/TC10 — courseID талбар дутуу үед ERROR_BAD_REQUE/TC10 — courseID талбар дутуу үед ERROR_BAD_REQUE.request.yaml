$kind: http-request
name: TC10 — courseID талбар дутуу үед ERROR_BAD_REQUEST
url: "{{baseURL}}/registrations"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"studentID": "S_TC10"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP статус 400", () => pm.response.to.have.status(400));
      pm.test("JSON Content-Type", () => pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"));
      const body = pm.response.json();
      pm.test("result = ERROR_BAD_REQUEST", () => pm.expect(body.result).to.equal("ERROR_BAD_REQUEST"));
      pm.test("Алдаанд registrationID үүсэхгүй", () => pm.expect(body).not.to.have.property("registrationID"));
    language: text/javascript
order: 3000
