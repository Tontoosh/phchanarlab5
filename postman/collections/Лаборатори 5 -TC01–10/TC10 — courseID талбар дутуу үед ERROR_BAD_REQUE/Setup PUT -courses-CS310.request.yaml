$kind: http-request
name: Setup PUT /courses/CS310
url: "{{baseURL}}/courses/CS310"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"prerequisites": ["CS201"]}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("Setup: HTTP 200", () => pm.response.to.have.status(200));
      pm.test("Setup: result = OK", () => pm.expect(pm.response.json()).to.eql({ result: "OK" }));
    language: text/javascript
order: 2000
