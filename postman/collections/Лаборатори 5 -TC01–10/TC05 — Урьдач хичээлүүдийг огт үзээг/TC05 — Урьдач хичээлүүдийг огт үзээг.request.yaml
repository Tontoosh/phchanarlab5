$kind: http-request
name: TC05 — Урьдач хичээлүүдийг огт үзээгүй үед ERROR_PREREQUISITES
url: "{{baseURL}}/registrations"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"studentID": "S_TC05", "courseID": "CS305"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP статус 200", () => pm.response.to.have.status(200));
      pm.test("JSON Content-Type", () => pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"));
      const body = pm.response.json();
      pm.test("result = ERROR_PREREQUISITES", () => pm.expect(body.result).to.equal("ERROR_PREREQUISITES"));
      pm.test("Алдаанд registrationID үүсэхгүй", () => pm.expect(body).not.to.have.property("registrationID"));
      pm.test("missing массив зөв", () => pm.expect(body.missing).to.eql(["CS201", "CS202"]));
    language: text/javascript
order: 3000
